<!-- Replace the <script> block at the bottom of pdf-to-word.html with this -->

<script src="../js/nav.js"></script>
<script src="../js/upload.js"></script>
<script src="../js/ads.js"></script>
<script>
  // ⬇ Replace this with your Render.com URL after deploying
  const API_URL = 'https://your-app-name.onrender.com';

  initUpload({
    zoneId: 'upload-zone',
    fileInputId: 'file-input',
    fileListId: 'file-list',
    actionBarId: 'action-bar',
    accept: ['.pdf', 'application/pdf'],
    multiple: false,
    onProcess: async function(files) {
      const formData = new FormData();
      formData.append('file', files[0]);

      const response = await fetch(API_URL + '/pdf-to-word', {
        method: 'POST',
        body: formData
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error || 'Conversion failed');
      }

      const blob = await response.blob();
      const url  = URL.createObjectURL(blob);
      const name = files[0].name.replace(/\.pdf$/i, '.docx');
      return { url, filename: name };
    }
  });
</script>
